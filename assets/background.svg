    <rect x="575" y="706" width="38" height="10"/>
    <rect x="633" y="706" width="38" height="10"/>
    <rect x="691" y="706" width="38" height="10"/>
    <rect x="885" y="706" width="38" height="10"/>
    <rect x="943" y="706" width="38" height="10"/>
    <rect x="1001" y="706" width="38" height="10"/>
    <rect x="1059" y="706" width="38" height="10"/>

    <!-- broken architraves -->
    <polygon points="572,608 572,586 600,580 640,584 671,578 671,608"/>
    <polygon points="926,608 926,578 957,584 997,580 1044,586 1044,608"/>

    <!-- fallen drum -->
    <rect x="360" y="694" width="86" height="20" rx="9"/>
    <rect x="1180" y="698" width="70" height="17" rx="8"/>
  </g>

  <!-- rim light on ruins (sun-facing edges) -->
  <g stroke="#ffab63" stroke-width="1.8" fill="none" opacity="0.35" filter="url(#blurS)">
    <path d="M710,622 L710,706"/>
    <path d="M1064,622 L1064,706"/>
    <path d="M671,578 L671,608"/>
    <path d="M926,578 L926,608"/>
  </g>

