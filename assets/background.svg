    <polygon points="240,300 15,712 226,712" fill="url(#pyrNearA)"/>
    <polygon points="240,300 226,712 487,712" fill="url(#pyrNearB)"/>
    <path d="M240,300 L226,712" stroke="#ffa05c" stroke-width="2.4" fill="none" opacity="0.34" filter="url(#blurS)"/>
    <!-- right main -->
    <polygon points="1360,300 1113,712 1374,712" fill="url(#pyrNearB)"/>
    <polygon points="1360,300 1374,712 1585,712" fill="url(#pyrNearA)"/>
    <path d="M1360,300 L1374,712" stroke="#ffa05c" stroke-width="2.4" fill="none" opacity="0.34" filter="url(#blurS)"/>
  </g>

  <!-- horizon haze band -->
  <rect x="0" y="646" width="1600" height="90" fill="#ffb878" opacity="0.13" filter="url(#blurL)"/>

  <!-- ==================== OBELISKS ==================== -->
  <g>
    <polygon points="155,716 170,524 190,524 205,716" fill="url(#ruinG)"/>
    <polygon points="170,524 180,486 190,524" fill="url(#goldTip)" opacity="0.9"/>
    <circle cx="180" cy="492" r="16" fill="#f0c24e" opacity="0.20" filter="url(#blurM)"/>
    <polygon points="1395,716 1410,524 1430,524 1445,716" fill="url(#ruinG)"/>
    <polygon points="1410,524 1420,486 1430,524" fill="url(#goldTip)" opacity="0.9"/>
    <circle cx="1420" cy="492" r="16" fill="#f0c24e" opacity="0.20" filter="url(#blurM)"/>
  </g>

  <!-- small broken columns flanking -->
  <g fill="url(#ruinG)">
    <rect x="250" y="650" width="24" height="66"/>
    <rect x="300" y="670" width="22" height="46"/>
    <rect x="206" y="682" width="20" height="34"/>
    <rect x="1330" y="650" width="24" height="66"/>
    <rect x="1285" y="670" width="22" height="46"/>
    <rect x="1372" y="682" width="20" height="34"/>
  </g>

  <!-- ==================== CENTRAL RUINS ==================== -->
  <g fill="url(#ruinG)">
    <!-- left colonnade -->
    <rect x="522" y="622" width="28" height="94"/>
    <rect x="580" y="606" width="28" height="110"/>
    <rect x="638" y="606" width="28" height="110"/>
    <rect x="696" y="622" width="28" height="94"/>
    <!-- right colonnade -->
    <rect x="890" y="622" width="28" height="94"/>
    <rect x="948" y="606" width="28" height="110"/>
    <rect x="1006" y="606" width="28" height="110"/>
    <rect x="1064" y="622" width="28" height="94"/>

    <!-- capitals -->
    <rect x="517" y="618" width="38" height="10"/>
    <rect x="575" y="602" width="38" height="10"/>
    <rect x="633" y="602" width="38" height="10"/>
    <rect x="691" y="618" width="38" height="10"/>
    <rect x="885" y="618" width="38" height="10"/>
    <rect x="943" y="602" width="38" height="10"/>
    <rect x="1001" y="602" width="38" height="10"/>
    <rect x="1059" y="618" width="38" height="10"/>

    <!-- bases -->
