  <path d="M0,772 C220,742 420,758 660,772 C900,786 1160,748 1380,764 C1480,771 1550,766 1600,770"
        fill="none" stroke="#e0794a" stroke-width="2.5" opacity="0.20" filter="url(#blurS)"/>

  <!-- ==================== PALMS ==================== -->
  <use href="#palm" transform="translate(150,900) scale(1.05)"/>
  <use href="#palm" transform="translate(268,884) scale(0.68)"/>
  <use href="#palm" transform="translate(1450,905) scale(-1.0,1.0)"/>
  <use href="#palm" transform="translate(1560,886) scale(-0.72,0.72)"/>

  <path d="M0,844 C260,812 520,836 800,846 C1080,856 1320,820 1600,838 L1600,900 L0,900 Z" fill="url(#dune3G)"/>
  <path d="M0,844 C260,812 520,836 800,846 C1080,856 1320,820 1600,838"
        fill="none" stroke="#b8563a" stroke-width="2.2" opacity="0.16" filter="url(#blurS)"/>

  <!-- ==================== FOREGROUND DETAILS ==================== -->
  <g fill="#04000a">
    <!-- rocks -->
    <ellipse cx="380"  cy="874" rx="58" ry="13"/>
    <ellipse cx="380"  cy="869" rx="42" ry="9" fill="#0c0412"/>
    <ellipse cx="1210" cy="884" rx="72" ry="15"/>
