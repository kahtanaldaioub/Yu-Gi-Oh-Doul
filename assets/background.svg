<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ============ SKY ============ -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#04020a"/>
      <stop offset="0.10" stop-color="#0d0620"/>
      <stop offset="0.20" stop-color="#1b0a33"/>
      <stop offset="0.30" stop-color="#2e1044"/>
      <stop offset="0.40" stop-color="#4a174f"/>
      <stop offset="0.50" stop-color="#6d2249"/>
      <stop offset="0.58" stop-color="#94333f"/>
      <stop offset="0.65" stop-color="#b94e37"/>
      <stop offset="0.71" stop-color="#d9763a"/>
      <stop offset="0.76" stop-color="#eea14e"/>
      <stop offset="0.80" stop-color="#f8c877"/>
      <stop offset="0.84" stop-color="#fce0a4"/>
      <stop offset="0.88" stop-color="#fdeec6"/>
      <stop offset="1"    stop-color="#fff6dd"/>
    </linearGradient>

    <!-- ============ SUN GLOW ============ -->
    <radialGradient id="hazeWide" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#ffbe7c" stop-opacity="0.55"/>
      <stop offset="0.32" stop-color="#ef8b46" stop-opacity="0.28"/>
      <stop offset="0.66" stop-color="#b8483a" stop-opacity="0.09"/>
      <stop offset="1"    stop-color="#8a2f3a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="hazeCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#fff0c8" stop-opacity="0.95"/>
      <stop offset="0.28" stop-color="#ffc478" stop-opacity="0.55"/>
      <stop offset="0.62" stop-color="#e0743c" stop-opacity="0.18"/>
      <stop offset="1"    stop-color="#c0503a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sunCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#fffdf4"/>
      <stop offset="0.45" stop-color="#fff4cd"/>
      <stop offset="0.80" stop-color="#ffdb96"/>
      <stop offset="1"    stop-color="#ffc06a" stop-opacity="0.9"/>
    </radialGradient>

    <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#cfe0ff" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#8fb0ff" stop-opacity="0"/>
    </radialGradient>

    <!-- ============ PYRAMIDS ============ -->
    <linearGradient id="pyrNearA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#190616"/>
      <stop offset="1" stop-color="#4a1526"/>
    </linearGradient>
    <linearGradient id="pyrNearB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25091c"/>
      <stop offset="1" stop-color="#5e2230"/>
    </linearGradient>
    <linearGradient id="pyrFarA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b2a3e"/>
      <stop offset="1" stop-color="#a85a48"/>
    </linearGradient>
    <linearGradient id="pyrFarB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d3346"/>
      <stop offset="1" stop-color="#bb6a50"/>
    </linearGradient>

    <!-- ============ RUINS ============ -->
    <linearGradient id="ruinG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c0722"/>
      <stop offset="1" stop-color="#0a020e"/>
    </linearGradient>
    <linearGradient id="goldTip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c24e"/>
      <stop offset="1" stop-color="#8a5a20"/>
    </linearGradient>

    <!-- ============ DUNES ============ -->
    <linearGradient id="dune1G" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2028"/>
      <stop offset="1" stop-color="#24081a"/>
    </linearGradient>
    <linearGradient id="dune2G" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a0f1e"/>
      <stop offset="1" stop-color="#150410"/>
    </linearGradient>
    <linearGradient id="dune3G" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e0614"/>
      <stop offset="1" stop-color="#06010a"/>
    </linearGradient>

    <!-- ============ VIGNETTE ============ -->
    <radialGradient id="vig" cx="0.5" cy="0.55" r="0.78">
      <stop offset="0.35" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#0a0210" stop-opacity="0.30"/>
      <stop offset="1"    stop-color="#050008" stop-opacity="0.68"/>
    </radialGradient>

    <!-- ============ FILTERS ============ -->
    <filter id="blurS"  x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="blurM"  x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="blurL"  x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blurXL" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="46"/></filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" stitchTiles="stitch" result="t"/>
      <feColorMatrix in="t" type="matrix"
        values="0 0 0 0 0.55
                0 0 0 0 0.48
                0 0 0 0 0.42
                0 0 0 0.42 0"/>
    </filter>

    <!-- ============ PALM SILHOUETTE ============ -->
    <g id="palm" fill="#0a020e">
      <path d="M-8,0 Q2,-120 -9,-232 L6,-237 Q17,-120 10,0 Z"/>
      <path d="M-1,-234 Q-58,-288 -128,-284 Q-62,-266 -5,-228 Z"/>
      <path d="M-1,-234 Q-24,-308 -36,-352 Q-4,-302 8,-232 Z"/>
      <path d="M-1,-234 Q52,-300 112,-296 Q58,-268 5,-228 Z"/>
      <path d="M-1,-234 Q84,-270 144,-248 Q88,-244 3,-226 Z"/>
      <path d="M-1,-234 Q74,-198 122,-154 Q66,-194 -1,-226 Z"/>
      <path d="M-1,-234 Q-84,-268 -150,-246 Q-88,-244 -4,-226 Z"/>
      <path d="M-1,-234 Q-80,-206 -130,-162 Q-72,-198 -4,-226 Z"/>
      <path d="M-1,-234 Q-16,-330 6,-380 Q20,-318 10,-232 Z"/>
      <circle cx="-7" cy="-226" r="5"/>
      <circle cx="5"  cy="-228" r="5"/>
      <circle cx="0"  cy="-218" r="4.5"/>
    </g>
  </defs>

  <!-- ==================== SKY ==================== -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- ==================== STARS ==================== -->
  <g fill="#ffffff">
    <circle cx="60"   cy="40"  r="1.4" opacity="0.90"/>
    <circle cx="150"  cy="90"  r="0.9" opacity="0.60"/>
    <circle cx="230"  cy="30"  r="1.1" opacity="0.75"/>
    <circle cx="320"  cy="120" r="0.8" opacity="0.50"/>
    <circle cx="410"  cy="55"  r="1.3" opacity="0.85"/>
    <circle cx="500"  cy="150" r="0.9" opacity="0.55"/>
    <circle cx="585"  cy="25"  r="1.0" opacity="0.70"/>
    <circle cx="670"  cy="105" r="0.8" opacity="0.45"/>
    <circle cx="760"  cy="60"  r="1.2" opacity="0.80"/>
    <circle cx="850"  cy="140" r="0.9" opacity="0.50"/>
    <circle cx="930"  cy="35"  r="1.1" opacity="0.70"/>
    <circle cx="1020" cy="115" r="0.8" opacity="0.45"/>
    <circle cx="1105" cy="70"  r="1.3" opacity="0.85"/>
    <circle cx="1190" cy="155" r="0.9" opacity="0.55"/>
    <circle cx="1275" cy="40"  r="1.0" opacity="0.70"/>
    <circle cx="1360" cy="120" r="0.8" opacity="0.50"/>
    <circle cx="1450" cy="65"  r="1.2" opacity="0.80"/>
    <circle cx="1540" cy="145" r="0.9" opacity="0.55"/>
    <circle cx="95"   cy="190" r="0.7" opacity="0.40"/>
    <circle cx="200"  cy="240" r="0.9" opacity="0.50"/>
    <circle cx="300"  cy="195" r="0.7" opacity="0.35"/>
    <circle cx="430"  cy="255" r="0.8" opacity="0.45"/>
    <circle cx="530"  cy="205" r="0.7" opacity="0.40"/>
    <circle cx="640"  cy="270" r="0.9" opacity="0.50"/>
    <circle cx="720"  cy="200" r="0.7" opacity="0.35"/>
    <circle cx="880"  cy="250" r="0.8" opacity="0.45"/>
    <circle cx="990"  cy="195" r="0.7" opacity="0.40"/>
    <circle cx="1090" cy="260" r="0.9" opacity="0.50"/>
    <circle cx="1180" cy="205" r="0.7" opacity="0.35"/>
    <circle cx="1300" cy="255" r="0.8" opacity="0.45"/>
    <circle cx="1420" cy="200" r="0.7" opacity="0.40"/>
    <circle cx="1520" cy="250" r="0.8" opacity="0.45"/>
    <circle cx="270"  cy="320" r="0.7" opacity="0.30"/>
    <circle cx="480"  cy="340" r="0.6" opacity="0.28"/>
    <circle cx="700"  cy="315" r="0.7" opacity="0.30"/>
    <circle cx="950"  cy="335" r="0.6" opacity="0.28"/>
    <circle cx="1150" cy="320" r="0.7" opacity="0.30"/>
    <circle cx="1380" cy="340" r="0.6" opacity="0.28"/>
    <circle cx="1550" cy="330" r="0.7" opacity="0.30"/>
  </g>
  <g opacity="0.85">
