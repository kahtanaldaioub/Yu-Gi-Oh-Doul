  <g fill="none" stroke="#1a0512" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
    <path d="M-11,0 Q-5,-8 0,-2 Q5,-8 11,0" transform="translate(962,332)"/>
    <path d="M-9,0  Q-4,-6 0,-1 Q4,-6 9,0"   transform="translate(1006,306) scale(0.85)"/>
    <path d="M-11,0 Q-5,-8 0,-2 Q5,-8 11,0" transform="translate(1048,338) scale(0.95)"/>
    <path d="M-9,0  Q-4,-6 0,-1 Q4,-6 9,0"   transform="translate(1085,300) scale(0.75)"/>
    <path d="M-9,0  Q-4,-6 0,-1 Q4,-6 9,0"   transform="translate(1112,326) scale(0.7)"/>
  </g>

