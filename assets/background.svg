  <path d="M0,706 C180,690 340,700 520,708 C700,716 880,696 1080,702 C1260,708 1440,694 1600,702 L1600,900 L0,900 Z" fill="url(#dune1G)"/>
  <path d="M0,706 C180,690 340,700 520,708 C700,716 880,696 1080,702 C1260,708 1440,694 1600,702"
