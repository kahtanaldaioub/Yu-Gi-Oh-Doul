    <!-- left secondary -->
    <polygon points="470,415 355,712 462,712" fill="url(#pyrFarA)"/>
    <polygon points="470,415 462,712 600,712" fill="url(#pyrFarB)"/>
    <!-- right secondary -->
    <polygon points="1130,415 1000,712 1138,712" fill="url(#pyrFarB)"/>
    <polygon points="1130,415 1138,712 1245,712" fill="url(#pyrFarA)"/>
