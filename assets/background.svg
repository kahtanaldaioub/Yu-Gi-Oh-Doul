  <g filter="url(#blurL)" opacity="0.55">
    <ellipse cx="800" cy="672" rx="720" ry="10" fill="#ffd79a" opacity="0.38"/>
    <ellipse cx="800" cy="700" rx="920" ry="17" fill="#ffbe7a" opacity="0.32"/>
    <ellipse cx="800" cy="626" rx="520" ry="7"  fill="#fff0cc" opacity="0.26"/>
  </g>

  <!-- sun disc -->
