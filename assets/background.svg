    <circle cx="760"  cy="60"  r="7" fill="url(#starGlow)"/>
    <circle cx="1105" cy="70"  r="8" fill="url(#starGlow)"/>
    <circle cx="1450" cy="65"  r="7" fill="url(#starGlow)"/>
    <circle cx="585"  cy="25"  r="6" fill="url(#starGlow)"/>
  </g>

  <!-- ==================== SUN GLOW ==================== -->
  <ellipse cx="800" cy="660" rx="1010" ry="430" fill="url(#hazeWide)"/>

  <!-- light rays -->
  <g filter="url(#blurL)" stroke-linecap="round" opacity="0.55">
    <line x1="800" y1="648" x2="430"  y2="-120" stroke="#ffcf90" stroke-width="54" opacity="0.10"/>
    <line x1="800" y1="648" x2="700"  y2="-170" stroke="#ffdca8" stroke-width="40" opacity="0.09"/>
    <line x1="800" y1="648" x2="900"  y2="-170" stroke="#ffdca8" stroke-width="40" opacity="0.09"/>
    <line x1="800" y1="648" x2="1170" y2="-120" stroke="#ffcf90" stroke-width="54" opacity="0.10"/>
    <line x1="800" y1="648" x2="120"  y2="200"  stroke="#ffb877" stroke-width="74" opacity="0.07"/>
    <line x1="800" y1="648" x2="1480" y2="200"  stroke="#ffb877" stroke-width="74" opacity="0.07"/>
  </g>

  <circle cx="800" cy="648" r="300" fill="url(#hazeCore)"/>

